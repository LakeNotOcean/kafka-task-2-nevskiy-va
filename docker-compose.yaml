name: kafka

# Общие переменные для экземпляров
x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 30s

x-producer-base: &producer-base
  build: .
  image: kafka-stand-app:local
  restart: on-failure
  stop_grace_period: 30s
  depends_on:
    topic-init:
      condition: service_completed_successfully
  volumes:
    - ./data:/data

x-producer-env: &producer-env
  KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  TOPIC: events
  RATE_PER_SEC: 10
  POISON_EVERY_N: 50
  USER_SHARD_COUNT: 3
  USERS_PER_PRODUCER: 100
  KEY_MODE: user_id

services:
  kafka-1:
    image: apache/kafka:4.4.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9092,EXTERNAL://localhost:9094
    ports:
      - "9094:9094"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:4.4.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9092,EXTERNAL://localhost:9095
    ports:
      - "9095:9095"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:4.4.0
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9092,EXTERNAL://localhost:9096
    ports:
      - "9096:9096"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  topic-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists \
          --topic events --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists \
          --topic events.dlt --partitions 3 --replication-factor 3
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --describe

  producer-1:
    <<: *producer-base
    environment:
      <<: *producer-env
      POD_ID: producer-1
      USER_SHARD_INDEX: 0
      DB_PATH: /data/producer-1.db

  producer-2:
    <<: *producer-base
    environment:
      <<: *producer-env
      POD_ID: producer-2
      USER_SHARD_INDEX: 1
      DB_PATH: /data/producer-2.db

  producer-3:
    <<: *producer-base
    environment:
      <<: *producer-env
      POD_ID: producer-3
      USER_SHARD_INDEX: 2
      DB_PATH: /data/producer-3.db

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data: